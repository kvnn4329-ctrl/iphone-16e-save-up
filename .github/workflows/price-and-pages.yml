name: Check exact iPhone price and publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # Once an hour, UK time is not required for price checks.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iphone-price-publish
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-configuration price matching
        run: python -m unittest discover -s tests -v
      - name: Check the selected phone price
        run: python scripts/check_price.py
      - name: Save the price history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price.json
          if ! git diff --cached --quiet; then
            git commit -m "Record iPhone price check"
            git push
          fi
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static website
        run: |
          mkdir -p site/data
          cp index.html styles.css app.js favicon.svg site/
          cp data/price.json site/data/price.json
          touch site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
